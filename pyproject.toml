[project]
name = "cli-to-api"
version = "0.1.0"
description = "Exposes LLM CLI applications as a web API"
readme = "README.md"
authors = [
    { name = "Rene Josiah M. Quinto", email = "josh@joshquinto.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
