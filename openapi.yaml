openapi: 3.1.0
info:
  title: cli-to-api
  version: 0.1.0
  description: |
    Exposes LLM CLI applications as a web API. A client sends a question and
    the name of a model; the service runs the corresponding CLI and returns
    the answer.

    Requests are synchronous: the call blocks until the CLI finishes.

    The API is unauthenticated; it is intended to run on a secured network.

servers:
  - url: http://localhost:8080
    description: Local development

# Explicitly unauthenticated; see info.description.
security: []

paths:
  /query:
    post:
      operationId: query
      summary: Ask an LLM a question
      description: |
        Sends `question` to the LLM identified by `model` and returns its answer.
        `model` is free-form; the server validates it against its configured
        models and rejects unknown values with `400 unknown_model`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
            example:
              question: What is the capital of France?
              model: claude-sonnet-5-5
      responses:
        "200":
          description: The model's answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
              example:
                answer: The capital of France is Paris.
                model: claude-sonnet-5-5
                duration_ms: 1834
        "400":
          description: Malformed request body or unknown model.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidRequest:
                  value:
                    error:
                      code: invalid_request
                      message: "`question` must not be empty."
                unknownModel:
                  value:
                    error:
                      code: unknown_model
                      message: "Model 'gpt-9' is not configured."
        "500":
          description: |
            The CLI failed or produced no usable answer (`upstream_error`), or the
            service itself hit an unexpected error (`internal_error`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                upstreamError:
                  value:
                    error:
                      code: upstream_error
                      message: CLI exited with status 1.
                internalError:
                  value:
                    error:
                      code: internal_error
                      message: Internal server error.
        "504":
          description: The CLI did not finish within the server's timeout.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: timeout
                  message: Model did not respond within 120s.

components:
  schemas:
    QueryRequest:
      type: object
      additionalProperties: false
      required: [question, model]
      properties:
        question:
          type: string
          minLength: 1
          description: The prompt to send to the LLM.
        model:
          type: string
          minLength: 1
          description: Identifier of the model to query, e.g. `claude-sonnet-5-5`.

    QueryResponse:
      type: object
      required: [answer, model, duration_ms]
      properties:
        answer:
          type: string
          description: The LLM's answer.
        model:
          type: string
          description: The model that produced the answer (echoed from the request).
        duration_ms:
          type: integer
          minimum: 0
          description: Wall-clock time spent running the query, in milliseconds.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - unknown_model
                - upstream_error
                - internal_error
                - timeout
              description: Machine-readable error code.
            message:
              type: string
              description: Human-readable description of the error.
